name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install chromium
      # todos os specs, sem lista: listar um a um já deixou teste novo fora
      # do CI em silêncio, duas vezes. screenshots.spec.js regrava PNGs, mas
      # o workspace do runner é descartado — no CI isso é inofensivo
      - run: npx playwright test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean Licitarium.spec
      - name: Anexar exe à release
        # o nome do exe carrega a versão ("Licitarium Free v1.35.0.exe"), então o
        # caminho vem por glob; falha explicitamente se não gerou exatamente um.
        # --clobber: se a release "solta a X.Y.Z" já subiu o exe na hora de
        # criar a release (gh release create ... exe), reenviar sem --clobber
        # sempre achava o asset já lá e falhava (achado 2026-08-13). Se a
        # release ainda não existe (tag subida sem gh release create antes,
        # achado 2026-08-30), cria na hora — sem notas (ficam em branco,
        # editáveis depois); o objetivo aqui é nunca depender de um passo
        # manual externo pra soltar de verdade.
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist/*.exe)
          if ($exe.Count -ne 1) { throw "esperava 1 exe em dist/, achei $($exe.Count)" }
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
          }
          gh release upload ${{ github.ref_name }} $exe[0].FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
